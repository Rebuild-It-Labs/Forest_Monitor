<polygon points="706.2,226.1 695.8,235.5 678.2,258.8 641.6,256.1 639.8,228.1 625,212.3 644.6,175.6 683.7,174.9 685.5,190" fill="#000"/></g>
<rect width="960" height="600" fill="rgba(120,150,170,0.06)"/>
</svg>
