    <feMorphology in="SourceAlpha" operator="erode" radius="2" result="inner"/>
    <feGaussianBlur in="inner" stdDeviation="2" result="innerBlur"/>
    <feComposite in="fill" in2="innerBlur" operator="in"/>
  </filter>
