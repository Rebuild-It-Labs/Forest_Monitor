    <feComponentTransfer><feFuncR type="linear" slope="0.5" intercept="0.02"/><feFuncG type="linear" slope="0.55" intercept="0.03"/><feFuncB type="linear" slope="0.55" intercept="0.03"/></feComponentTransfer>
  </filter>
