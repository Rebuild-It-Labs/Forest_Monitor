  <radialGradient id="warm"><stop offset="0" stop-color="#ff7a45" stop-opacity="0.75"/><stop offset="0.5" stop-color="#ff2e63" stop-opacity="0.35"/><stop offset="1" stop-color="#ff2e63" stop-opacity="0"/></radialGradient>
</defs>
